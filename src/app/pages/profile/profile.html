<mat-card class="profile-component" appearance="raised">
  <mat-card-header class="header">
    <mat-card-title class="titulo">Meus dados</mat-card-title>
  </mat-card-header>
  <form [formGroup]="form">
    <mat-form-field class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>
  </form>
  <mat-card-content>

  </mat-card-content>
</mat-card>
