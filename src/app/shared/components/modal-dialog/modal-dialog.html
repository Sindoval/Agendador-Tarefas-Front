<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    @for (field of fields; track field.name) {
    <mat-form-field class="full-width">
      <mat-label>{{field.label}}</mat-label>
      <input matInput [formControlName]="field.name" />
      @if(field.button) {
      <button matIconButton matSuffix (click)="field.button.callback(form.get(field.name)?.value, dialogRef)">
        <mat-icon>{{field.button.icon}}</mat-icon>
      </button>
      }
    </mat-form-field>
    }


  </form>

</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onCancel()">Cancelar</button>
  <button matButton cdkFocusInitial (click)="onSave()">Adicionar</button>
</mat-dialog-actions>
